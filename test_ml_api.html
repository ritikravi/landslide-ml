<!DOCTYPE html>
<html>
<head>
    <title>ML API Test</title>
</head>
<body>
    <h1>ML API Direct Test</h1>
    <button onclick="testAPI()">Test ML API</button>
    <pre id="result"></pre>

    <script>
        async function testAPI() {
            const result = document.getElementById('result');
            result.textContent = 'Testing...';
            
            try {
                const response = await fetch('https://landslide-ml-api.onrender.com/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        soilMoisture: 100,
                        waterLevel: 0,
                        tilt: 0,
                        vibration: 0,
                        ultrasonicDistance: 8.5,
                        rainfall: 0,
                        elevation: 350,
                        slope: 5,
                        aspect: 180,
                        history: [
                            {
                                soilMoisture: 100,
                                waterLevel: 0,
                                tilt: 0,
                                vibration: 0,
                                ultrasonicDistance: 8.5,
                                timestamp: "2026-09-08T11:24:05.050Z"
                            }
                        ]
                    })
                });

                const data = await response.json();
                result.textContent = JSON.stringify(data, null, 2);
                
                if (data.success) {
                    result.style.color = 'green';
                } else {
                    result.style.color = 'red';
                }
            } catch (error) {
                result.textContent = 'Error: ' + error.message;
                result.style.color = 'red';
            }
        }
    </script>
</body>
</html>
